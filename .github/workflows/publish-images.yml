name: Publish render engine images

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'render/**'
      - 'src/autobom/base/socket_protocol.py'
      - 'docker-compose.yaml'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FREECAD_IMAGE: ghcr.io/opulo-inc/autobom-freecad
  KICAD_IMAGE: ghcr.io/opulo-inc/autobom-kicad

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (FreeCAD)
        id: meta-freecad
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FREECAD_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Docker metadata (KiCAD)
        id: meta-kicad
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.KICAD_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push FreeCAD image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: render/Dockerfile-freecad-gha
          push: true
          tags: ${{ steps.meta-freecad.outputs.tags }}
          labels: ${{ steps.meta-freecad.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=freecad
          cache-to: type=gha,mode=max,scope=freecad

      - name: Build and push KiCAD image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: render/Dockerfile-kicad
          push: true
          tags: ${{ steps.meta-kicad.outputs.tags }}
          labels: ${{ steps.meta-kicad.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=kicad
          cache-to: type=gha,mode=max,scope=kicad
