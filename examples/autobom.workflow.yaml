# Copy this file to your hardware repo as:
#   .github/workflows/autobom.yaml
#
# Requires in your repo root:
#   - autobom.json
#   - a BOM file (path set in autobom.json, e.g. bom.json)
#   - CAD sources somewhere in the repo (FreeCAD .FCStd and/or KiCAD projects)

name: AutoBOM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  autobom:
    runs-on: ubuntu-latest
    # Needed so the action can attach Autobom-<tag>.zip to the GitHub Release.
    permissions:
      contents: write
    steps:
      - name: Checkout hardware repo
        uses: actions/checkout@v4

      - name: Run AutoBOM
        uses: opulo-inc/autobom@v0.2.0
        # Or on bleeding edge:
        # uses: opulo-inc/autobom@main

      # On every run: workflow artifact "Autobom".
      # On release: also attaches Autobom-<tag>.zip to the GitHub Release.
