services:
  freecad:
    build:
      context: ${GITHUB_ACTION_PATH}
      dockerfile: render/Dockerfile-freecad-gha
    container_name: freecad
    volumes:
      - ${GITHUB_ACTION_PATH}/renderQueue:/renderQueue
    ports:
      - "9001:9001"

  kicad:
    build:
      context: ${GITHUB_ACTION_PATH}
      dockerfile: render/Dockerfile-kicad
    container_name: kicad
    volumes:
      - ${GITHUB_ACTION_PATH}/renderQueue:/renderQueue
    ports:
      - "9002:9002"

  wireviz:
    build:
      context: ${GITHUB_ACTION_PATH}
      dockerfile: render/Dockerfile-wireviz
    container_name: wireviz
    volumes:
      - ${GITHUB_ACTION_PATH}/renderQueue:/renderQueue
    ports:
      - "9003:9003"
