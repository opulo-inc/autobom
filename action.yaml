# action.yml
name: 'AutoBOM'
description: 'Automatically export and render your hardware project'
branding:
  icon: 'crosshair'
  color: 'yellow'
runs:
  using: 'composite'
  steps:
    - name: Start Render Engines
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        mkdir -p "${{ github.action_path }}/renderQueue"/{freecad,openscad,kicad,wireviz}/{in,out}
        compose="${{ github.action_path }}/docker-compose.yaml"
        docker compose -f "$compose" up -d --build

    - name: Wait for Render Engines
      shell: bash
      run: |
        set -euo pipefail
        wait_for_port() {
          local port="$1"
          local name="$2"
          for i in $(seq 1 180); do
            if (echo >/dev/tcp/127.0.0.1/"$port") >/dev/null 2>&1; then
              echo "$name is ready on port $port"
              return 0
            fi
            sleep 2
          done
          echo "Timed out waiting for $name on port $port"
          docker compose -f "${{ github.action_path }}/docker-compose.yaml" logs
          return 1
        }
        wait_for_port 9001 freecad
        wait_for_port 9002 kicad
        wait_for_port 9003 wireviz

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install UV package manager
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Run AutoBOM
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail
        uv run --project "${{ github.action_path }}" autobom

    - name: Prepare artifact
      id: artifact
      if: always()
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        REPO_FULL: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        repo="${REPO_FULL#*/}"
        if [[ "$EVENT_NAME" == "release" && -n "$RELEASE_TAG" ]]; then
          ref="$RELEASE_TAG"
        else
          ref="${SHA:0:7}"
        fi
        safe_repo="$(printf '%s' "$repo" | tr '/\\:*?"<>|' '-')"
        safe_ref="$(printf '%s' "$ref" | tr '/\\:*?"<>|' '-')"
        name="autobom-${safe_repo}-${safe_ref}"
        stage="${RUNNER_TEMP}/autobom-artifact"
        rm -rf "$stage"
        mkdir -p "$stage"
        if [[ -d autobom ]]; then
          cp -a autobom "$stage/$name"
        fi
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "stage=$stage" >> "$GITHUB_OUTPUT"
        echo "repo=$safe_repo" >> "$GITHUB_OUTPUT"
        echo "ref=$safe_ref" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ steps.artifact.outputs.stage }}
        if-no-files-found: warn

    - name: Attach Autobom to release
      if: github.event_name == 'release' && success()
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        SAFE_REPO: ${{ steps.artifact.outputs.repo }}
        SAFE_REF: ${{ steps.artifact.outputs.ref }}
      run: |
        set -euo pipefail
        if [[ ! -d autobom ]]; then
          echo "No autobom/ directory to attach"
          exit 0
        fi
        stage="${RUNNER_TEMP}/autobom-release"
        rm -rf "$stage"
        mkdir -p "$stage"
        if [[ -f autobom/manifest.json ]]; then
          base="autobom-${SAFE_REPO}-${SAFE_REF}"
          cp -a autobom "$stage/$base"
          zip_name="${base}.zip"
          (cd "$stage" && zip -r "$zip_name" "$base")
          gh release upload "$RELEASE_TAG" "$stage/$zip_name" --clobber
          echo "Attached $zip_name to release $RELEASE_TAG"
        else
          shopt -s nullglob
          for manifest in autobom/*/manifest.json; do
            bom_dir="$(dirname "$manifest")"
            bom_id="$(basename "$bom_dir")"
            if [[ "$bom_id" == "${SAFE_REPO}-"* ]]; then
              base="autobom-${bom_id}-${SAFE_REF}"
            else
              base="autobom-${SAFE_REPO}-${bom_id}-${SAFE_REF}"
            fi
            cp -a "$bom_dir" "$stage/$base"
            zip_name="${base}.zip"
            (cd "$stage" && zip -r "$zip_name" "$base")
            gh release upload "$RELEASE_TAG" "$stage/$zip_name" --clobber
            echo "Attached $zip_name to release $RELEASE_TAG"
          done
        fi

    - name: Dump render engine logs
      if: failure()
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: |
        docker compose -f "${{ github.action_path }}/docker-compose.yaml" logs --no-color --tail=200 || true

    - name: Stop Render Engines
      if: always()
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: |
        docker compose -f "${{ github.action_path }}/docker-compose.yaml" down || true
