# action.yml
name: 'AutoBOM'
description: 'Automatically export and render your hardware project'
branding:
  icon: 'crosshair'
  color: 'yellow'
runs:
  using: 'composite'
  steps:
    - name: Start Render Engines
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        compose="${{ github.action_path }}/docker-compose.yaml"
        docker compose -f "$compose" up -d --build

    - name: Wait for Render Engines
      shell: bash
      run: |
        set -euo pipefail
        wait_for_port() {
          local port="$1"
          local name="$2"
          for i in $(seq 1 180); do
            if (echo >/dev/tcp/127.0.0.1/"$port") >/dev/null 2>&1; then
              echo "$name is ready on port $port"
              return 0
            fi
            sleep 2
          done
          echo "Timed out waiting for $name on port $port"
          docker compose -f "${{ github.action_path }}/docker-compose.yaml" logs
          return 1
        }
        wait_for_port 9001 freecad
        wait_for_port 9002 kicad

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install UV package manager
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install uv

    - name: Run AutoBOM
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail
        uv run --project "${{ github.action_path }}" autobom

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Autobom
        path: ./autobom

    - name: Stop Render Engines
      if: always()
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: |
        docker compose -f "${{ github.action_path }}/docker-compose.yaml" down || true
